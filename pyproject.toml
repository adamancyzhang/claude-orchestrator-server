[project]
name = "claude-mcp-server"
version = "0.1.0"
description = "MCP server orchestrating multiple Claude Code instances via ZooKeeper"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "kazoo>=2.10.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
